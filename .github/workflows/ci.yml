name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: athena
          POSTGRES_PASSWORD: athena_dev
          POSTGRES_USER: athena
        options: >-
          --health-cmd "pg_isready -U athena -d athena"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: make check
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret

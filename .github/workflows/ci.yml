name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: athena
          POSTGRES_PASSWORD: athena_dev
          POSTGRES_USER: athena
        options: >-
          --health-cmd "pg_isready -U athena -d athena"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Check backend formatting and migrations
        run: |
          ruff format --check backend
          ruff check backend
          python backend/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Test accounts, catalog, and health
        run: python backend/manage.py test accounts catalog health
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Test calendar and policy domain
        run: python backend/manage.py test circulation.test_policy_domain
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Test reservation flows
        run: |
          output_file="$(mktemp)"
          if ! python backend/manage.py test circulation.test_circulation_flow.ReservationFlowTests 2>&1 | tee "$output_file"; then
            message="$(tail -80 "$output_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Reservation flow failure::$message"
            exit 1
          fi
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Test missed pickup and notice flows
        run: python backend/manage.py test circulation.test_circulation_flow.MissedPickupAndNoticeTests
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Test governance and historical analytics
        run: |
          output_file="$(mktemp)"
          if ! python backend/manage.py test governance 2>&1 | tee "$output_file"; then
            message="$(tail -80 "$output_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Governance test failure::$message"
            exit 1
          fi
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Check frontend
        run: make check-frontend
      - name: Install browsers for frontend E2E
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: Test responsive and accessible frontend journeys
        run: |
          output_file="$(mktemp)"
          if ! npm run test:e2e 2>&1 | tee "$output_file"; then
            message="$(tail -120 "$output_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Frontend E2E failure::$message"
            exit 1
          fi
        working-directory: frontend
      - name: Verify repository structure
        run: ./scripts/verify_bootstrap.sh
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      - name: Validate production deployment configuration
        run: |
          cp .env.production.example .env.production
          docker compose -f compose.production.yaml config --quiet
          docker build -t athena-api:test backend
          DJANGO_SETTINGS_MODULE=config.production \
            DJANGO_SECRET_KEY='CI-only-7vQ2!pL9#xR4@kM8%tN6&zW3*eS5-uH1+aD0=fG9?cB' \
            DJANGO_ALLOWED_HOSTS=api.example.org \
            CORS_ALLOWED_ORIGINS=https://example.github.io \
            python backend/manage.py check --deploy
      - name: Prove encrypted database and media restoration
        run: |
          output_file="$(mktemp)"
          set +e
          (
          set -euxo pipefail
          docker compose -f compose.production.yaml up -d --wait postgres
          docker compose -f compose.production.yaml exec -T postgres \
            psql -U athena -d athena -c 'CREATE TABLE backup_probe (value text); INSERT INTO backup_probe VALUES ('\''preserved'\'');'
          docker compose -f compose.production.yaml run --rm --no-deps -T api \
            touch /app/media/backup-probe
          mkdir -p "$RUNNER_TEMP/athena-backups"
          backup_file="$(./scripts/backup.sh "$RUNNER_TEMP/athena-backups")"
          docker compose -f compose.production.yaml exec -T postgres \
            psql -U athena -d athena -c 'DROP TABLE backup_probe;'
          docker compose -f compose.production.yaml run --rm --no-deps -T api \
            sh -c 'find /app/media -mindepth 1 -delete'
          ATHENA_RESTORE_CONFIRM=restore-athena ./scripts/restore_backup.sh "$backup_file"
          docker compose -f compose.production.yaml exec -T postgres \
            psql -U athena -d athena -tAc "SELECT value FROM backup_probe WHERE value = 'preserved'" | grep -qx preserved
          docker compose -f compose.production.yaml run --rm --no-deps -T api \
            test -f /app/media/backup-probe
          ) 2>&1 | tee "$output_file"
          result="${PIPESTATUS[0]}"
          if [[ "$result" -ne 0 ]]; then
            message="$(tail -80 "$output_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Backup restoration failure::$message"
          fi
          exit "$result"
        env:
          ATHENA_BACKUP_PASSPHRASE: ci-only-backup-passphrase
          POSTGRES_DB: athena
          POSTGRES_USER: athena
      - name: Simulate documented data volume and 500 concurrent clients
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_load_data --readers 5000 --titles 20000 --copies 50000
          gunicorn --chdir backend config.wsgi:application \
            --bind 127.0.0.1:8000 --workers 4 --access-logfile - --error-logfile - &
          server_pid="$!"
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ >/dev/null; then
              break
            fi
            sleep 1
          done
          python3 scripts/load_test.py http://127.0.0.1:8000/api/v1/health/ --clients 500
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret

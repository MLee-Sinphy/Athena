name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Select backend URL
        env:
          CONFIGURED_BACKEND_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ "$CONFIGURED_BACKEND_URL" == https://* ]]; then
            echo "VITE_API_BASE_URL=$CONFIGURED_BACKEND_URL" >> "$GITHUB_ENV"
          else
            echo "VITE_API_BASE_URL=https://athena.179-197-79-149.sslip.io/api/v1" >> "$GITHUB_ENV"
            echo "Using Athena's study-server backend."
          fi
      - run: npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
